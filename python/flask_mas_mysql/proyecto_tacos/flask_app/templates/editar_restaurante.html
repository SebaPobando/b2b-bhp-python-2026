<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <title>Editar restaurante</title>
</head>
<body>
    <nav class="p-3">
        <a href="/" class="btn btn-info btn-outline-primary">Inicio</a>
        <a href="/restaurantes" class="btn btn-outline-primary">Todos los restaurantes</a>
    </nav>

    <form action="/restaurantes/actualizar/{{restaurante.id}}" method="post" class="p-3 col-4 mx-auto my-5 border">
        <h2 class="text-center text-primary">Editar restaurante {{restaurante.id}}:</h2>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="alert alert-danger" role="alert">
                {% for message in messages %}
                <p class="mb-0">{{message}}</p>
                {% endfor %}
            </div>
            {% endif %}
        {% endwith %}

        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" name="nombre" id="nombre" class="form-control" value="{{restaurante.nombre}}" required>
        </div>
        <input type="submit" value="Actualizar" class="btn btn-warning mt-3">
        <a href="/restaurantes/mostrar/{{restaurante.id}}" class="btn btn-secondary mt-3">Cancelar</a>
    </form>
</body>
</html>
